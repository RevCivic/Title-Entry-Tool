services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-titles}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-titles}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  title-entry-tool:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: ${PORT:-8000}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-titles}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DEFAULT_STATE: ${DEFAULT_STATE:-NM}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-hybrid}
      AI_ENDPOINT: ${AI_ENDPOINT:-http://ollama:11434}
      AI_MODEL: ${AI_MODEL:-moondream}
      AI_TIMEOUT: ${AI_TIMEOUT:-60}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.6}
      # Used by the maintenance panel to filter containers by compose project.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-title-entry-tool}
    volumes:
      - app_data:/app/data
      # Docker socket – gives the maintenance panel read/start access to
      # sibling containers.  Remove this volume if you do not need the
      # in-app maintenance features.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  # ── AI services ────────────────────────────────────────────────────────────
  # Only started when the "ai" profile is active.
  #
  # Activate via environment variable (preferred – works with Portainer/GitOps):
  #   COMPOSE_PROFILES=ai   →  set this in your .env file or stack env vars
  #
  # Activate via CLI flag (alternative):
  #   docker compose --profile ai up
  #
  # The app starts and accepts uploads immediately using OCR while the model
  # downloads in the background.  Once the model is ready, AI-assisted
  # extraction is used automatically (when EXTRACTION_PROVIDER=hybrid or ai).

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    profiles: [ai]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      # CPU-first default: set to "" or remove in docker-compose.gpu.yml to
      # let Ollama auto-detect GPU availability.
      OLLAMA_NUM_GPU: "0"
    healthcheck:
      # Checks that the Ollama HTTP API is responsive (model need not be loaded yet).
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  ollama-init:
    # One-shot container: pulls the configured model into the shared ollama_data
    # volume so it is available to the ollama service on next startup.
    # Keep this image tag in sync with the ollama service above.
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    profiles: [ai]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        MODEL="$${AI_MODEL:-moondream}"
        HOST="$${OLLAMA_HOST:-http://ollama:11434}"
        HOST="$${HOST%/}"
        echo "Pulling model '$${MODEL}' from $${HOST} ..."

        # Retry up to 3 times with a short back-off.  The depends_on
        # service_healthy condition means the API should be reachable, but
        # retrying guards against transient timing issues.
        for attempt in 1 2 3; do
          echo "  attempt $${attempt}/3"
          if OLLAMA_HOST="$${HOST}" ollama pull "$${MODEL}"; then
            echo "Model '$${MODEL}' pulled successfully."
            exit 0
          fi
          if [ "$${attempt}" -lt 3 ]; then
            sleep 5
          fi
        done

        echo "ERROR: failed to pull model '$${MODEL}' after 3 attempts." \
             "Check the model name, network connectivity, and available disk" \
             "space on the ollama_data volume." >&2
        exit 1
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_MODEL: ${AI_MODEL:-moondream}
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  postgres_data:
  app_data:
  ollama_data:
