services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-titles}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-titles}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    command:
      - /bin/sh
      - -c
      - |
        ollama serve &
        OLLAMA_PID=$!
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        ollama pull "${AI_MODEL:-moondream}"
        wait "$OLLAMA_PID"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      AI_MODEL: ${AI_MODEL:-moondream}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags | grep -q '\"name\":\"${AI_MODEL:-moondream}'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  title-entry-tool:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: ${PORT:-8000}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-titles}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DEFAULT_STATE: ${DEFAULT_STATE:-NM}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-hybrid}
      AI_ENDPOINT: ${AI_ENDPOINT:-http://ollama:11434}
      AI_MODEL: ${AI_MODEL:-moondream}
      AI_TIMEOUT: ${AI_TIMEOUT:-60}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.6}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  postgres_data:
  app_data:
  ollama_data:
