services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-titles}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-titles}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    command:
      - /bin/sh
      - -c
      - |
        ollama serve &
        OLLAMA_PID=$!
        ready_timeout_seconds="${OLLAMA_READY_TIMEOUT_SECONDS}"
        elapsed_seconds=0
        until ollama list >/dev/null 2>&1; do
          if ! kill -0 "$OLLAMA_PID" 2>/dev/null; then
            echo "Ollama server process exited before becoming ready." >&2
            wait "$OLLAMA_PID"
            exit 1
          fi
          elapsed_seconds=$((elapsed_seconds + 2))
          if [ "$elapsed_seconds" -ge "$ready_timeout_seconds" ]; then
            echo "Ollama API did not become ready within ${ready_timeout_seconds}s." >&2
            wait "$OLLAMA_PID"
            exit 1
          fi
          sleep 2
        done
        if ! ollama pull "${AI_MODEL}"; then
          echo "Failed to pull model: ${AI_MODEL} (check model name, network access, and available disk space)." >&2
          wait "$OLLAMA_PID"
          exit 1
        fi
        wait "$OLLAMA_PID"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      AI_MODEL: ${AI_MODEL:-moondream}
      OLLAMA_READY_TIMEOUT_SECONDS: ${OLLAMA_READY_TIMEOUT_SECONDS:-120}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags | grep -q \"\\\"name\\\":\\\"$${AI_MODEL}\""]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  title-entry-tool:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: ${PORT:-8000}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-titles}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DEFAULT_STATE: ${DEFAULT_STATE:-NM}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-hybrid}
      AI_ENDPOINT: ${AI_ENDPOINT:-http://ollama:11434}
      AI_MODEL: ${AI_MODEL:-moondream}
      AI_TIMEOUT: ${AI_TIMEOUT:-60}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.6}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  postgres_data:
  app_data:
  ollama_data:
