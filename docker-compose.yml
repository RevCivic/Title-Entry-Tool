services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-titles}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-titles}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  title-entry-tool:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: ${PORT:-8000}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-titles}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DEFAULT_STATE: ${DEFAULT_STATE:-NM}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-hybrid}
      AI_ENDPOINT: ${AI_ENDPOINT:-http://ollama:11434}
      AI_MODEL: ${AI_MODEL:-moondream}
      AI_TIMEOUT: ${AI_TIMEOUT:-60}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.6}
      # Used by the maintenance panel to filter containers by compose project.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-title-entry-tool}
    volumes:
      - app_data:/app/data
      # Docker socket – gives the maintenance panel read/start access to
      # sibling containers.  Remove this volume if you do not need the
      # in-app maintenance features.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  # ── AI services ────────────────────────────────────────────────────────────
  # Only started when the "ai" profile is active.
  #
  # Activate via environment variable (preferred – works with Portainer/GitOps):
  #   COMPOSE_PROFILES=ai   →  set this in your .env file or stack env vars
  #
  # Activate via CLI flag (alternative):
  #   docker compose --profile ai up
  #
  # The app starts and accepts uploads immediately using OCR while the model
  # downloads in the background.  Once the model is ready, AI-assisted
  # extraction is used automatically (when EXTRACTION_PROVIDER=hybrid or ai).

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    profiles: [ai]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      # CPU-first default: set to "" or remove in docker-compose.gpu.yml to
      # let Ollama auto-detect GPU availability.
      OLLAMA_NUM_GPU: "0"
    healthcheck:
      # Use the built-in CLI instead of curl so this check remains valid across
      # Ollama image changes where curl may not be present.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      # Give Ollama extra startup time on slower hosts before marking unhealthy.
      start_period: 90s

  ollama-init:
    # One-shot container: pulls the configured model into the shared ollama_data
    # volume so it is available to the ollama service on next startup.
    # Keep this image tag in sync with the ollama service above.
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    profiles: [ai]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        MODEL="$${AI_MODEL:-moondream}"
        HOST="$${OLLAMA_HOST:-http://ollama:11434}"
        HOST="$${HOST%/}"
        echo "Preparing model '$${MODEL}' ..."

        # Wait for the Ollama API to become responsive. We intentionally
        # perform this here (instead of requiring service_healthy) so orchestration
        # layers don't fail stack deployment before useful diagnostics are logged.
        OLLAMA_API_WAIT_ATTEMPTS=45
        OLLAMA_API_WAIT_SECONDS=2
        API_READY=0
        for attempt in $$(seq 1 "$${OLLAMA_API_WAIT_ATTEMPTS}"); do
          if OLLAMA_HOST="$${HOST}" ollama list >/dev/null 2>&1; then
            API_READY=1
            echo "Ollama API is reachable."
            break
          fi
          echo "Waiting for Ollama API ... attempt $${attempt}/$${OLLAMA_API_WAIT_ATTEMPTS}"
          sleep "$${OLLAMA_API_WAIT_SECONDS}"
        done

        if [ "$${API_READY}" -ne 1 ]; then
          echo "ERROR: Ollama API did not become reachable after $${OLLAMA_API_WAIT_ATTEMPTS} attempts (sleep $${OLLAMA_API_WAIT_SECONDS}s between attempts). Check 'docker compose logs ollama' for startup failures and host resource constraints (CPU/RAM/disk)." >&2
          # Exit 0 so the core stack stays running and diagnostics remain available.
          exit 0
        fi

        # Helper: pull a single model with up to 3 retries.
        # Usage: pull_model <name>
        # Returns 0 on success, 1 if all attempts fail.
        pull_model() {
          _pm_name="$$1"
          for attempt in 1 2 3; do
            echo "  attempt $${attempt}/3"
            if OLLAMA_HOST="$${HOST}" ollama pull "$${_pm_name}"; then
              echo "Model '$${_pm_name}' pulled successfully."
              return 0
            fi
            if [ "$${attempt}" -lt 3 ]; then
              sleep 5
            fi
          done
          return 1
        }

        # If the model is already present locally (e.g. a custom model created via
        # the app's Training dashboard, or a previously-pulled registry model),
        # skip the pull entirely.  Match the model name followed by whitespace so
        # that a name like 'titles' does not accidentally match 'titles-custom'.
        if OLLAMA_HOST="$${HOST}" ollama list 2>/dev/null | grep -q "^$${MODEL}[[:space:]]"; then
          echo "Model '$${MODEL}' is already available locally. Nothing to pull."
        else
          echo "Model '$${MODEL}' not found locally. Pulling from registry ..."
          # NOTE: if '$${MODEL}' is a custom model built via the app's Training
          # dashboard (e.g. 'titles-custom'), it cannot be downloaded from the
          # public registry.  Use the Training UI to create it first:
          #   Annotate → approve corrections → Apply to LLM.
          # The pull attempts below will only succeed for public Ollama models.
          if ! pull_model "$${MODEL}"; then
            echo "WARNING: could not pull '$${MODEL}' from the registry." \
                 "If this is a custom model (built via the Training dashboard)," \
                 "use Training → Apply to AI Model to create it first." \
                 "The app will continue using OCR-only extraction until the model" \
                 "is available.  Run 'docker compose logs ollama-init' to review" \
                 "this output, then restart this service to retry." >&2
          fi
        fi

        # Always ensure the base model (LLM_BASE_MODEL, or 'moondream' as the
        # default) is available locally.  This is required so that the Training
        # dashboard's "Apply to AI Model" feature can build a custom model even
        # when AI_MODEL is already set to a custom name like 'titles-custom'.
        # The Ollama /api/create endpoint uses the base model as the starting
        # point; if the base model is missing, model creation fails with a
        # "file does not exist" / manifest error.
        BASE_MODEL="$${LLM_BASE_MODEL:-}"
        if [ -z "$${BASE_MODEL}" ]; then
          # Default: use moondream unless AI_MODEL already resolved to it.
          if [ "$${MODEL}" != "moondream" ]; then
            BASE_MODEL="moondream"
          fi
        fi

        if [ -n "$${BASE_MODEL}" ] && [ "$${BASE_MODEL}" != "$${MODEL}" ]; then
          echo "Ensuring base model '$${BASE_MODEL}' is available (needed for Training → Apply to AI Model) ..."
          if OLLAMA_HOST="$${HOST}" ollama list 2>/dev/null | grep -q "^$${BASE_MODEL}[[:space:]]"; then
            echo "Base model '$${BASE_MODEL}' is already available locally."
          else
            echo "Pulling base model '$${BASE_MODEL}' ..."
            if ! pull_model "$${BASE_MODEL}"; then
              echo "ERROR: failed to pull base model '$${BASE_MODEL}' after 3 attempts." \
                   "Training → Apply to AI Model will fail until this model is available." \
                   "Check network connectivity, disk space on the ollama_data volume," \
                   "and verify the model name at https://ollama.com/library." >&2
            fi
          fi
        fi
        # Exit 0 so orchestrators (Portainer, Compose) do not treat a failed
        # model pull as a fatal stack error and tear down the other services.
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_MODEL: ${AI_MODEL:-moondream}
      LLM_BASE_MODEL: ${LLM_BASE_MODEL:-}
    depends_on:
      ollama:
        # Keep deployment resilient: start once Ollama container is up, then do
        # explicit readiness polling in the init script above with detailed logs.
        condition: service_started

volumes:
  postgres_data:
  app_data:
  ollama_data:
