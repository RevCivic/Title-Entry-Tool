name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  # ── 1. Unit tests ────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  # ── 2. Docker image build ────────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t title-entry-tool:ci .

  # ── 3. Compose config validation ─────────────────────────────────────────
  compose-validate:
    name: Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  # ── 4. Smoke test (core services only) ───────────────────────────────────
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy example env
        run: cp .env.example .env

      - name: Build and start core services
        run: docker compose up -d --build postgres title-entry-tool

      - name: Wait for /health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo ""
              echo "Health check passed on attempt $i."
              exit 0
            fi
            echo "Waiting for app to be ready… ($i/30)"
            sleep 3
          done
          echo "Health check timed out after 90 seconds."
          docker compose logs title-entry-tool
          exit 1

      - name: Verify /api/status endpoint
        run: curl -sf http://localhost:8000/api/status

      - name: Tear down
        if: always()
        run: docker compose down -v
